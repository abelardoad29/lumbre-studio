<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Corre antes del primer pintado (ver useThemePreference.js, useScrollReveal.js y utils/language.js).
      (function () {
        var root = document.documentElement;
        try {
          // 1. Idioma: en "/" se redirige a "/es" si el navegador prefiere espanol y no hay eleccion manual.
          //    Nunca se saca a nadie de "/es": Googlebot navega en ingles y debe poder indexar ambas versiones.
          if (location.pathname === "/") {
            var pref = localStorage.getItem("langPref");
            if (pref !== "en" && pref !== "es") {
              var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
              for (var i = 0; i < langs.length; i++) {
                var code = String(langs[i]).toLowerCase();
                if (code.indexOf("en") === 0) break;
                if (code.indexOf("es") === 0) {
                  root.style.visibility = "hidden";
                  location.replace("/es" + location.search + location.hash);
                  return;
                }
              }
            }
          }
        } catch (error) {}
        try {
          // 2. Tema guardado o el del sistema.
          var storedTheme = localStorage.getItem("themePref");
          root.dataset.theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
        } catch (error) {
          root.dataset.theme = "dark";
        }
        // 3. Animaciones al hacer scroll: solo si hay JS. Si el bundle no carga a tiempo, se muestra todo.
        root.classList.add("js");
        setTimeout(function () {
          if (!window.__lumbreRevealReady) root.classList.remove("js");
        }, 5000);
      })();
    </script>
